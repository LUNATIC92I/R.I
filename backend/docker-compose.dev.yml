# DEVELOPMENT ONLY. Synthetic data, local secrets generated by the developer.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aic
      POSTGRES_USER: aic_owner
      POSTGRES_PASSWORD: ${AIC_DEV_DB_PASSWORD:?set AIC_DEV_DB_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["aic_pg:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env
    depends_on: [db]
    ports: ["127.0.0.1:8000:8000"]
volumes:
  aic_pg: {}
