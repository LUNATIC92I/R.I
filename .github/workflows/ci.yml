name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aic_test
          POSTGRES_PASSWORD: aic_test_only
          POSTGRES_DB: aic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aic_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: bandit -q -r app -ll
      - run: pip-audit -r requirements.txt
      - run: pytest
        env:
          AIC_TEST_DATABASE_URL: postgresql+psycopg://aic_test:aic_test_only@localhost:5432/aic_test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
